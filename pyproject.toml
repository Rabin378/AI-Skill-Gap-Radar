[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-skill-gap-radar"
version = "0.1.0"
description = "Analyze job postings, salary signals, and trends to recommend high-value skills to learn next."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Skill Gap Radar" }]
dependencies = []

[project.optional-dependencies]
app = ["plotly>=5.22", "streamlit>=1.36"]
dev = ["pytest>=8.0"]

[project.scripts]
skill-gap-radar = "skill_gap_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
